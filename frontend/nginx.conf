server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache the app shell; hashed Vite assets can be cached long-term.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
